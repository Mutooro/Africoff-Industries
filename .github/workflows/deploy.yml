name: Deploy to Vercel

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$VERCEL_ORG_ID" ] || fail "VERCEL_ORG_ID secret is empty or missing. Check repo secrets AND the 'production' environment secrets (environment secrets override repo secrets)."
          [ -n "$VERCEL_PROJECT_ID" ] || fail "VERCEL_PROJECT_ID secret is empty or missing. Check repo secrets AND the 'production' environment secrets (environment secrets override repo secrets)."
          case "$VERCEL_ORG_ID$VERCEL_PROJECT_ID" in
            *[!A-Za-z0-9_-]*) fail "VERCEL_ORG_ID/VERCEL_PROJECT_ID contain invalid characters (spaces, newlines or quotes). Re-copy them from Vercel project/team Settings."; ;;
          esac
          echo "Linking with orgId=${VERCEL_ORG_ID:0:6}… and projectId=${VERCEL_PROJECT_ID:0:6}…"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # This step handles both compiling your Nuxt project and validating the build
      - name: Build Vercel deployment
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
